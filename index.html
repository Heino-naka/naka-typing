<title>いばらきタイピング探検MAP</title>

<meta property="og:url" content="https://heino-naka.github.io/ibaraki-typing-map/">

<style>
:root{
  --ink:#2b2140; --ink2:#5a4d6e; --line:#3a2e4f; --paper:#fff8ee; --paper2:#f3e7d6; --sun:#ff8a3d; --gold:#f2b134; --ok:#2e9e6a;
  --sea1:#bfe3f3; --sea2:#9fd0ea; --land:#fffdf6; --none:#e9e2d6; --none2:#d9cfbf;
  --font:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  --mono:"Consolas","Menlo","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);font-size:clamp(14px,.6vw + 8px,18px);overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse at 70% 20%,#d9f0fa 0%,var(--sea1) 45%,var(--sea2) 100%) fixed}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:minmax(300px,410px) 1fr;gap:clamp(10px,1.6vw,24px);height:100vh;padding:clamp(8px,1.4vh,16px) clamp(10px,1.6vw,22px);max-width:1500px;margin:0 auto}
/* ---- ひだりの パネル ---- */
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding-bottom:4px;scrollbar-width:thin}
.head{display:flex;gap:10px;align-items:center}
.qr{flex:none;background:#fff;border-radius:12px;padding:5px 5px 3px;text-align:center;box-shadow:0 3px 0 rgba(43,33,64,.18);width:clamp(70px,6.4vw,92px)}
.qr img{display:block;width:100%;height:auto;image-rendering:pixelated}
.qr span{display:block;font-size:10px;font-weight:700;line-height:1.5}
h1{font-size:clamp(22px,1.9vw,32px);line-height:1.25;letter-spacing:.03em}
.nb{display:inline-block}
h1 small{display:block;font-size:.5em;color:#c8602a;letter-spacing:.08em;margin-bottom:2px}
.lead{font-size:.88em;color:var(--ink2);font-weight:700;margin-top:4px;line-height:1.5}
.card{background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 rgba(43,33,64,.14),0 10px 26px rgba(43,33,64,.12)}
.prog{display:flex;align-items:center;gap:10px;font-weight:700}
.prog .big{font-family:var(--mono);font-size:1.9em;line-height:1}
.prog .big small{font-size:.5em;color:var(--ink2)}
.bar{flex:1;height:14px;border-radius:999px;background:#e6ddd0;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:9px;font-size:.78em;color:var(--ink2);font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{flex:none;width:18px;height:14px;border-radius:4px;border:2px solid var(--line)}
/* せんたく した 町 */
.info h2{font-size:clamp(22px,1.8vw,30px);display:flex;align-items:center;gap:8px;line-height:1.2}
.info h2 .ico{width:1.5em;height:1.5em;flex:none}
.info .gt{font-size:.86em;color:var(--ink2);font-weight:700;margin:4px 0 8px}
.stagebox{display:flex;align-items:center;gap:8px;border-radius:12px;padding:7px 10px;font-weight:700;margin-bottom:8px;background:#fff}
.dots{display:inline-flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.stats div{background:#fff;border-radius:10px;padding:5px 8px;font-size:.72em;color:var(--ink2);font-weight:700}
.stats b{display:block;color:var(--ink);font-size:1.25em;line-height:1.3}
.hint{font-size:.84em;line-height:1.6;background:#fff3dd;border-radius:10px;padding:7px 10px;margin-bottom:8px;font-weight:700}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;font-size:1.15em;font-weight:700;color:#fff;text-decoration:none;
  background:linear-gradient(180deg,#ffa24d,#ff7a1f);box-shadow:0 5px 0 #c45a12;transition:transform .05s}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c45a12}
.go.off{background:#b9b0a4;box-shadow:0 5px 0 #8f877c;pointer-events:none}
.pcnote{font-size:.72em;line-height:1.5;color:var(--ink2);text-align:center;margin-top:14px;margin-bottom:12px}
.nbh{font-size:.86em;font-weight:700;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 11px 5px 6px;font-size:.84em;font-weight:700;background:#fff;border:2px solid var(--line);box-shadow:0 2px 0 rgba(43,33,64,.25)}
.chip .ico{width:1.4em;height:1.4em}
.chip.mute{border-color:#c9bfb0;color:#9a8f82;box-shadow:none;padding-left:11px}
.chip:active{transform:translateY(2px)}
.games{display:grid;gap:6px}
.grow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 10px 6px 6px;font-weight:700;text-align:left;width:100%;border:2px solid transparent}
.grow.sel{border-color:var(--line)}
.grow .ico{width:34px;height:34px;flex:none}
.grow .gn{flex:1;line-height:1.25}
.grow .gn small{display:block;font-size:.72em;color:var(--ink2)}
.tag{font-size:.7em;border-radius:999px;padding:2px 8px;background:#efe7da;color:var(--ink2);white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{background:#fff;border-radius:10px;padding:6px 10px;font-size:.78em;font-weight:700;box-shadow:0 2px 0 rgba(43,33,64,.2)}
.notice{background:#fffbe8;border:2px dashed #d9b84a;border-radius:14px;padding:8px 12px;font-size:.78em;line-height:1.65;color:#4a3d2a}
.notice b:first-child{display:block;margin-bottom:2px}
.notice p{margin:0}
.foot{font-size:.7em;color:#2f4a5e;line-height:1.7;text-align:center;margin-top:auto;padding-top:4px}
.foot a{font-weight:700}
/* ---- ちず ---- */
.mapwrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#map{width:100%;height:100%;max-height:calc(100vh - 24px);display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.town{cursor:pointer}
.town path{stroke:var(--line);stroke-width:2.6;stroke-linejoin:round;transition:fill .5s ease}
.town.s0 path{fill:var(--land)}
.town.s3 path{stroke:#e0a800;stroke-width:5.5}
.town.nog path{fill:var(--none)}
.town:hover path{filter:brightness(1.04)}
.town:focus{outline:none}
.town:focus-visible path{stroke-width:5}
.lbl{font-family:var(--font);font-weight:700;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fffdf6;stroke-width:6px;stroke-linejoin:round;pointer-events:none}
.lbl.small{font-size:calc(19px * var(--k,1));fill:#8a7f95;stroke-width:calc(6px * var(--k,1))}
.lbl.game{font-size:calc(30px * var(--k,1));fill:var(--ink);stroke-width:calc(7px * var(--k,1))}
.lbl.nbr{fill:var(--ink);font-size:calc(23px * var(--k,1))}
.selline{fill:none;stroke:#ff7a1f;stroke-width:7;stroke-linejoin:round;pointer-events:none}
.nbrline{fill:none;stroke:#ffcf5c;stroke-width:9;stroke-linejoin:round;pointer-events:none;opacity:.85;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.95}}
.arrow{fill:none;stroke:#ff7a1f;stroke-width:6;stroke-linecap:round;stroke-dasharray:14 12;animation:flow 1s linear infinite;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-26}}
.steps{fill:none;stroke:#7a4a2a;stroke-width:6;stroke-linecap:round;stroke-dasharray:.1 16;opacity:.75;pointer-events:none}
.badge{cursor:pointer}
.badge .bg{fill:#fff;stroke:var(--line);stroke-width:3.5}
.badge .ring{fill:none;stroke-width:7}
.badge.soon{opacity:.92}
.flag{transform-box:fill-box;transform-origin:0 100%;animation:wave 1.4s ease-in-out infinite alternate}
@keyframes wave{to{transform:skewY(-6deg)}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.2s ease-in-out infinite}
@keyframes spark{0%,100%{transform:scale(.5) rotate(0);opacity:.3}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
.paint{animation:paint 1.4s ease-out}
@keyframes paint{0%{filter:brightness(1.6) saturate(.2)}60%{filter:brightness(1.15)}100%{filter:none}}
.fullbtn{position:absolute;top:6px;right:6px;z-index:5;background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 rgba(43,33,64,.25)}
.fullbtn[hidden]{display:none}
.sea{font-family:var(--font);font-weight:700;fill:#5b98bb;font-size:30px;letter-spacing:.4em;pointer-events:none}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:#fff;border-radius:18px;padding:10px 22px;font-weight:700;z-index:30;transition:.35s;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:92vw;text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.demo{position:fixed;right:10px;bottom:10px;background:#fff3dd;border:2px dashed #c8602a;color:#9a4a12;border-radius:12px;padding:6px 12px;font-weight:700;font-size:13px;z-index:20}
.modal{position:fixed;inset:0;background:rgba(20,12,35,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.on{display:flex}
.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto;line-height:1.8}
.modal h3{font-size:1.25em;margin-bottom:6px}
.modal ul{margin:6px 0 10px 1.3em}
.modal .close{display:block;margin:10px auto 0;background:var(--sun);color:#fff;border-radius:12px;padding:10px 26px;font-weight:700;box-shadow:0 4px 0 #c8602a}
.ico{display:block;overflow:visible}
@media (max-width:820px),(max-aspect-ratio:1/1){
  .app{grid-template-columns:1fr;height:auto}
  .mapwrap{order:-1}
  #map{max-height:none;height:auto}
  .side{overflow:visible}
  .lbl.small{font-size:calc(22px * var(--k,1))}
}
@media (prefers-reduced-motion:reduce){.nbrline,.arrow,.flag,.spark{animation:none}.paint{animation:none}}
</style>
</head>

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function coinSVG(g,cls){return '<svg class="ico '+(cls||'')+'" viewBox="0 0 100 100" aria-hidden="true"><g filter="url(#roughS)" stroke="#3a2e4f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">'+(COIN[g.coin]||'')+'</g></svg>'}

// ===== 保存の 読みこみ =====
let SEEN={stages:{},sound:true};
try{const s=JSON.parse(localStorage.getItem(SEEN_KEY)||'null'); if(s) SEEN=Object.assign(SEEN,s)}catch(e){}
function saveSeen(){if(DEMO)return;try{localStorage.setItem(SEEN_KEY,JSON.stringify(SEEN))}catch(e){}}
function getJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function titleOf(g,score){const T=g.titles||[[0,'']];let t=T[0];for(const x of T)if(score>=x[0])t=x;return t[1]}
const DEMO_REC={'08302':{best:9400,owned:190,cert:true,t:1},'08236':{best:3200,owned:61,cert:false,t:2},'08216':{best:350,owned:8,cert:false,t:3}};
function readRecord(g){
  let best=0,owned=0,machiOwned=0,cert=false,played=false,t=0;
  if(DEMO){const d=DEMO_REC[g.code]; if(!d) return {stage:0,best:0,owned:0,machiOwned:0,cert:false,t:0};
    ({best,owned,cert,t}=d); played=true; machiOwned=cert?(g.machi?g.machi.length:0):Math.floor((g.machi?g.machi.length:0)*.4);}
  else{
    const S=getJSON(g.key);
    if(S&&typeof S==='object'){
      const b=S.best||{}; best=Math.max(0,...Object.values(b).map(Number).filter(n=>isFinite(n)));
      const C=S.cards||{}; const has=id=>!!C[id];
      owned=g.cards?g.cards.filter(has).length:Object.keys(C).filter(k=>C[k]).length;
      if(g.machi){machiOwned=g.machi.filter(has).length; cert=machiOwned===g.machi.length||(g.cards&&owned===g.cards.length)}
      played=!!S.played||best>0||owned>0;
    }
    const M=getJSON(COMMON_KEY), c=M&&M.towns&&M.towns[g.code];
    if(c){played=true; best=Math.max(best,+c.best||0); owned=Math.max(owned,+c.cards||0); cert=cert||!!c.cert; t=+c.t||0}
  }
  const [t2,t3]=TH(g);
  const stage=!played?0:best>=t3?3:best>=t2?2:1;
  return {stage,best,owned,machiOwned,cert,t};
}
let REC={};
function readAll(){REC={};GAMES.forEach(g=>{REC[g.code]=g.open?readRecord(g):{stage:0,best:0,owned:0,machiOwned:0,cert:false,t:0}})}

// ===== おと（Web Audio・みじかい こうかおん）=====
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC}
function tone(f,d,type,v,w){if(!SEEN.sound)return;const a=ac();if(!a)return;const t=a.currentTime+(w||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SE={pick(){tone(660,.08);tone(990,.1,'triangle',.05,.06)},none(){tone(330,.1,'triangle',.04)},
  paint(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'triangle',.07,i*.08))}};

// ===== 地図を かく =====
const towns=$('towns'), labels=$('labels'), badges=$('badges'), fx=$('fx'), steps=$('steps');
const TOWN_EL={};
function drawSea(){
  const s=$('seaDeco');
  for(let i=0;i<7;i++){const y=260+i*150, x=930+(i%2)*30;
    el('path',{d:`M${x} ${y}q14-9 28 0t28 0`,fill:'none',stroke:'#7fb8d8','stroke-width':4,'stroke-linecap':'round'},s)}
  el('text',{x:990,y:520,class:'sea',style:'writing-mode:vertical-rl'},s).textContent='たいへいよう';
  const sh=$('landShadow'); el('path',{d:MAP.pref,fill:'#5b98bb',opacity:.35,transform:'translate(7 9)'},sh);
}
function drawTowns(){
  for(const code in MAP.m){
    const t=MAP.m[code], g=GBY[code];
    const grp=el('g',{class:'town'+(g?'':' nog'),'data-code':code,tabindex:0,role:'button','aria-label':t.n+(g?(g.open?'（ゲームあり）':'（じゅんびちゅう）'):'')},towns);
    el('path',{d:t.d},grp); TOWN_EL[code]=grp;
    if(!g){el('text',{x:t.x,y:t.y,class:'lbl small','data-code':code},labels).textContent=t.n}
  }
}
function drawBadges(){
  badges.innerHTML='';
  GAMES.forEach(g=>{
    const t=MAP.m[g.code]; if(!t) return; const r=REC[g.code]; const P=badgePos(g);
    const b=el('g',{class:'badge'+(g.open?'':' soon'),'data-code':g.code,transform:`translate(${P.x} ${P.y})`},badges);
    el('circle',{class:'bg',r:34},b);
    if(r.stage>0) el('circle',{class:'ring',r:40,stroke:r.stage===3?'#e0a800':g.color,'stroke-width':r.stage===3?9:7,'stroke-dasharray':r.stage>=2?'none':'9 6'},b);
    const ic=el('g',{transform:'translate(-26 -26) scale(.52)',filter:'url(#roughS)',stroke:'#3a2e4f','stroke-width':3,'stroke-linejoin':'round','stroke-linecap':'round',fill:'none'},b);
    ic.innerHTML=COIN[g.coin]||'';
    if(r.cert){
      const f=el('g',{transform:'translate(22 -40)'},b);
      el('path',{d:'M0 0V42',stroke:'#3a2e4f','stroke-width':4,'stroke-linecap':'round'},f);
      el('path',{class:'flag',d:'M0 2L30 10L0 20z',fill:'#ef4a5a',stroke:'#3a2e4f','stroke-width':3,'stroke-linejoin':'round'},f);
    }
    if(r.stage===3) el('path',{class:'spark',d:'M-40 -26l4 9 9 4-9 4-4 9-4-9-9-4 9-4z',fill:'#ffd35c',stroke:'#3a2e4f','stroke-width':2},b);
    if(!g.open){el('rect',{x:-62,y:26,width:124,height:26,rx:13,fill:'#fff3dd',stroke:'#3a2e4f','stroke-width':2.5},b);
      el('text',{x:0,y:40,class:'lbl','font-size':17,fill:'#9a4a12',style:'stroke-width:0'},b).textContent='じゅんびちゅう'}
    const lb=el('text',{x:P.x,y:P.y+(g.open?52:70),class:'lbl game','data-code':g.code},labels); lb.textContent=t.n;
  });
}
function paintTowns(){
  for(const code in TOWN_EL){
    const g=GBY[code], p=TOWN_EL[code].firstChild, grp=TOWN_EL[code];
    if(!g){continue}
    const s=REC[code].stage; grp.classList.remove('s0','s1','s2','s3'); grp.classList.add('s'+s);
    p.style.fill=s===0?'':s===1?g.light:g.color;
  }
}
function badgePos(g){const t=MAP.m[g.code];return {x:g.bx!=null?g.bx:t.x,y:g.by!=null?g.by:t.y-14}}
function drawSteps(){
  steps.innerHTML='';
  const played=GAMES.filter(g=>REC[g.code]&&REC[g.code].stage>0&&MAP.m[g.code]).sort((a,b)=>(REC[a.code].t||0)-(REC[b.code].t||0)||GAMES.indexOf(a)-GAMES.indexOf(b));
  for(let i=1;i<played.length;i++){
    const a=badgePos(played[i-1]), b=badgePos(played[i]);
    const mx=(a.x+b.x)/2+(b.y-a.y)*.25, my=(a.y+b.y)/2-(b.x-a.x)*.25;
    el('path',{class:'steps',d:`M${a.x} ${a.y}Q${mx} ${my} ${b.x} ${b.y}`},steps);
  }
}

// ===== ズーム（えらんだ 町と となりを 大きく 見せる）=====
const MAPSVG=$('map'), FULL=[-36,-24,1076,1336];
const REDUCE=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let VB=FULL.slice(), vbAnim=0, VIEW='full';
function fitBox(x0,y0,x1,y1,pad,minW){
  x0-=pad;y0-=pad;x1+=pad;y1+=pad; let w=x1-x0,h=y1-y0;
  const cw=MAPSVG.clientWidth||1, ch=MAPSVG.clientHeight||1, r=cw/ch;
  if(w<minW){x0-=(minW-w)/2;w=minW} if(h<minW/r){y0-=(minW/r-h)/2;h=minW/r}
  if(w/h<r){const nw=h*r;x0-=(nw-w)/2;w=nw}else{const nh=w/r;y0-=(nh-h)/2;h=nh}
  return [x0,y0,w,h];
}
function applyVB(){
  MAPSVG.setAttribute('viewBox',VB.map(v=>(+v).toFixed(1)).join(' '));
  const k=Math.max(.55,Math.min(1,VB[2]/FULL[2]*1.15)); MAPSVG.style.setProperty('--k',k.toFixed(3)); $('seaDeco').style.opacity=k>.95?1:0;
  badges.querySelectorAll('.badge').forEach(b=>{const g=GBY[b.dataset.code],P=badgePos(g);b.setAttribute('transform',`translate(${P.x} ${P.y}) scale(${k.toFixed(3)})`)});
  labels.querySelectorAll('.lbl.game').forEach(l=>{const g=GBY[l.dataset.code],P=badgePos(g);l.setAttribute('y',P.y+(g.open?52:70)*k)});
}
function setVB(target,instant){
  cancelAnimationFrame(vbAnim);
  if(instant||REDUCE){VB=target;applyVB();return}
  const from=VB.slice(), t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/560), e=1-Math.pow(1-k,3);
    VB=from.map((v,i)=>v+(target[i]-v)*e); applyVB(); if(k<1)vbAnim=requestAnimationFrame(step)};
  vbAnim=requestAnimationFrame(step);
}
function viewFull(instant){VIEW='full'; setVB(fitBox(FULL[0],FULL[1],FULL[0]+FULL[2],FULL[1]+FULL[3],0,0),instant); $('fullBtn').hidden=true}
function viewTown(code,instant){
  const ids=[code,...neighborsOf(code)]; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ids.forEach(id=>{const b=MAP.m[id].b; x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3])});
  VIEW=code; setVB(fitBox(x0,y0,x1,y1,40,520),instant); $('fullBtn').hidden=false;
}
window.addEventListener('resize',()=>{VIEW==='full'?viewFull(true):viewTown(VIEW,true)});

// ===== えらぶ =====
let SEL=null;
function neighborsOf(code){return (MAP.m[code]&&MAP.m[code].adj)||[]}
function select(code,quiet){
  SEL=code; fx.innerHTML='';
  labels.querySelectorAll('.lbl.small').forEach(l=>l.classList.remove('nbr'));
  if(code){
    const nb=neighborsOf(code);
    nb.forEach(n=>{el('path',{class:'nbrline',d:MAP.m[n].d},fx); const l=labels.querySelector(`.lbl.small[data-code="${n}"]`); if(l)l.classList.add('nbr')});
    el('path',{class:'selline',d:MAP.m[code].d},fx);
    const a=GBY[code]?badgePos(GBY[code]):{x:MAP.m[code].x,y:MAP.m[code].y};
    nb.filter(n=>GBY[n]).forEach(n=>{const b=badgePos(GBY[n]);
      const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1, s=(GBY[code]?44:16)/L, e=52/L;
      const x1=a.x+dx*s, y1=a.y+dy*s, x2=b.x-dx*e, y2=b.y-dy*e, mx=(x1+x2)/2-dy*.2, my=(y1+y2)/2+dx*.2;
      el('path',{class:'arrow',d:`M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}`,'marker-end':'url(#ah)'},fx)});
    if(!quiet)(GBY[code]?SE.pick:SE.none)();
    viewTown(code);
  }else viewFull();
  renderInfo(); renderGameList();
}
function chip(code){
  const g=GBY[code], n=MAP.m[code].n;
  if(g) return `<button class="chip" data-sel="${code}">${coinSVG(g)}${esc(n)}${g.open?'':' <small>（じゅんびちゅう）</small>'}</button>`;
  return `<button class="chip mute" data-sel="${code}">${esc(n)}</button>`;
}
function dotsHTML(g,s,cert){return '<span class="dots">'+[1,2,3].map(i=>`<i style="${i<=s?'background:'+(i===1?g.light:i===3?'#ffd35c':g.color):''}"></i>`).join('')+(cert?'<em style="font-style:normal;margin-left:2px">🚩</em>':'')+'</span>'}
function renderInfo(){
  const box=$('info');
  if(!SEL){
    const any=GAMES.some(g=>REC[g.code].stage>0);
    box.innerHTML=`<h2>🗺️ 町を えらんでね</h2><p class="gt" style="margin-bottom:0;line-height:1.7">${any?'ぬった 町の となりにも 行ってみよう。<br>地図の 町を おすと、となりの 町が 光るよ。':'コインの マークが ある 町で、タイピング探検が できるよ。<br>あそんだ 町は、地図に 色が つくよ。'}</p>`;
    return;
  }
  const t=MAP.m[SEL], g=GBY[SEL], nb=neighborsOf(SEL);
  const nbGames=nb.filter(n=>GBY[n]), nbOther=nb.filter(n=>!GBY[n]);
  let h='';
  if(g){
    const r=REC[SEL];
    h+=`<h2>${coinSVG(g)}${esc(t.n)}</h2><p class="gt">${esc(g.title)}</p>`;
    if(g.open){
      h+=`<div class="stagebox">${dotsHTML(g,r.stage,r.cert)}<span>${STAGE_NAME[r.stage]}</span></div>`;
      if(r.stage>0){
        h+=`<div class="stats"><div>ハイスコア<b>${r.best}てん</b></div><div>しょうごう<b>${esc(titleOf(g,r.best))}</b></div>
          <div>ずかん<b>${r.owned}${g.cards?' / '+g.cards.length:''} まい</b></div><div>しょうしょ<b>${r.cert?'🚩 ゲット！':'まだ'}</b></div></div>`;
      }
      const [t2,t3]=TH(g);
      const certHint=r.cert?'':`${esc(g.unit)}の カードを 全部あつめると、旗が立つよ。${g.machi?'（いま '+r.machiOwned+' / '+g.machi.length+'）':''}`;
      const skill=r.stage===0?`あそぶと、地図の ${esc(t.n)}に 色が つくよ。`
        :r.stage===1?`どれかの コースで ${t2}てん 以上 とると、色が こくなるよ。`
        :r.stage===2?`${t3}てん 以上 とると、金の ふちの「マスター」に なれるよ！`
        :'マスターだ！ すごい！ つぎは、ほんものの 町へ 出かけてみよう。';
      const hint=r.stage===0?skill:skill+(certHint?'<br>'+certHint:(r.stage<3?'<br>🚩 カードも ぜんぶ あつめたね！':''));
      h+=`<p class="hint">${hint}</p>`;
      h+=`<a class="go" href="${esc(g.url)}">▶ ${esc(t.n)}で あそぶ</a><p class="pcnote">⌨️ ゲームは パソコン・Chromebook で あそんでね</p>`;
    }else{
      h+=`<p class="hint">もうすぐ あそべるよ。おたのしみに！</p><span class="go off">じゅんびちゅう</span>`;
    }
  }else{
    h+=`<h2>📍 ${esc(t.n)}</h2><p class="gt">${esc(t.n)}の ゲームは、まだ ないよ。</p>`;
    const open=nbGames.filter(n=>GBY[n].open);
    h+=open.length?`<p class="hint">となりの ${open.map(n=>esc(MAP.m[n].n)).join('・')}で あそべるよ！</p>`:`<p class="hint">いつか ${esc(t.n)}の ゲームも できるかな？</p>`;
  }
  if(nb.length){
    h+=`<div class="nbh">となりの 町</div><div class="chips">${nbGames.map(chip).join('')}${nbOther.map(chip).join('')}</div>`;
  }
  box.innerHTML=h;
}
function renderGameList(){
  $('gameList').innerHTML=GAMES.map(g=>{
    const r=REC[g.code], n=MAP.m[g.code]?MAP.m[g.code].n:g.code;
    const tag=g.open?(r.stage>0?STAGE_NAME[r.stage].replace('！',''):'まだ'):'じゅんびちゅう';
    return `<button class="grow${SEL===g.code?' sel':''}" data-sel="${g.code}">${coinSVG(g)}<span class="gn">${esc(n)}<small>${esc(g.catch)}</small></span>${g.open?dotsHTML(g,r.stage,r.cert):''}<span class="tag">${tag}</span></button>`;
  }).join('');
}
function renderProgress(){
  const open=GAMES.filter(g=>g.open), played=open.filter(g=>REC[g.code].stage>0).length;
  $('pNum').innerHTML=played+'<small> / '+open.length+'</small>';
  $('pBar').innerHTML=open.map(g=>{const s=REC[g.code].stage;return `<i style="width:${100/open.length}%;background:${s===0?'transparent':s===1?g.light:g.color};${REC[g.code].cert?'box-shadow:inset 0 0 0 2px #ef4a5a':''}"></i>`}).join('');
}

// ===== クリック・キーボード =====
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-sel]'); if(s){ac();select(s.dataset.sel);return}
  const t=e.target.closest('.town,.badge'); if(t){ac();select(t.dataset.code===SEL?null:t.dataset.code)}
});
document.addEventListener('keydown',e=>{
  if($('modal').classList.contains('on')&&e.key==='Escape'){$('modal').classList.remove('on');return}
  const t=e.target.closest&&e.target.closest('.town'); if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ac();select(t.dataset.code)}
  if(e.key==='Escape'&&SEL)select(null);
});
$('sndBtn').onclick=()=>{SEEN.sound=!SEEN.sound;saveSeen();renderSnd();if(SEEN.sound){ac();SE.pick()}};
function renderSnd(){$('sndBtn').textContent=SEEN.sound?'🔊 おと ON':'🔇 おと OFF'}
$('aboutBtn').onclick=()=>{
  $('modalBody').innerHTML=`<h3>📘 おうちの人・先生へ</h3>
  <p>茨城県の 町ごとの タイピングゲーム「タイピング探検」を、地図から えらべる 入り口です。遊んだ町は、地図に 色が つきます。</p>
  <ul><li><b>登録は いりません。</b>記録は、遊んだ 端末の ブラウザの中（localStorage）だけに あり、外には 送りません。</li>
  <li>地図の色は、<b>同じ端末・同じブラウザ</b>で 遊んだ 記録から つきます。べつの パソコンや シークレットモードでは 反映されません。</li>
  <li>色の段階：あそんだ ／ ${TH(GAMES[0])[0]}点以上（6つめの しょうごう）で 色が こくなる ／ ${TH(GAMES[0])[1]}点以上（10個めの しょうごう＝マスター）で 金の ふち。点数は、3つの コースの 中の <b>いちばん 高い 1回の 点数</b>です。町名カードを ぜんぶ 集めて しょうしょを もらうと、🚩 の はたが たちます（色とは べつ）。</li>
  <li>ゲームは キーボードで 遊ぶので、パソコン・Chromebook 向けです。</li>
  <li><b>個人制作のゲームです。</b>作者（へいなか）が 1人で 作っているため、内容に 多少の 不備や 間違いが あるかもしれません。お気づきの 点は、作者まで お知らせください。</li></ul>
  <p style="font-size:.85em;color:var(--ink2)">地図：国土数値情報（行政区域データ）国土交通省 を加工して作成。</p>
  <button class="close" onclick="document.getElementById('modal').classList.remove('on')">とじる</button>`;
  $('modal').classList.add('on')};
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('on')});

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.classList.remove('on'),2600)}

// ===== ぬれた！ の 演出 =====
function celebrate(){
  const ev=[];
  GAMES.forEach(g=>{const r=REC[g.code];
    if(r.stage>(SEEN.stages[g.code]||0)) ev.push({g,msg:`🎨 ${MAP.m[g.code].n}が「${STAGE_NAME[r.stage].replace('！','')}」の 色に なったよ！`});
    if(r.cert&&!(SEEN.cert||{})[g.code]) ev.push({g,msg:`🚩 ${MAP.m[g.code].n}に はたが たったよ！`});
  });
  ev.forEach((e,i)=>setTimeout(()=>{
    const grp=TOWN_EL[e.g.code]; if(grp){grp.classList.remove('paint');void grp.getBBox();grp.classList.add('paint')}
    SE.paint(); toast(e.msg);
  },700+i*2900));
  SEEN.cert=SEEN.cert||{};
  GAMES.forEach(g=>{SEEN.stages[g.code]=REC[g.code].stage; if(REC[g.code].cert)SEEN.cert[g.code]=1}); saveSeen();
}

function refresh(){readAll();paintTowns();drawBadges();applyVB();drawSteps();renderProgress();renderInfo();renderGameList()}
drawSea(); drawTowns(); refresh(); renderSnd(); viewFull(true);
if(DEMO){const d=document.createElement('div');d.className='demo';d.textContent='デモ表示（ほんとうの 記録は つかっていません）';document.body.appendChild(d)}
celebrate();
window.addEventListener('storage',e=>{if(!e.key||/_typing_|ibaraki_typing_map/.test(e.key)){refresh();celebrate()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){refresh();celebrate()}});
</script>
